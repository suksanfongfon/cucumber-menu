<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cucumber Menu • เมนูแตงร้าน</title>
  <meta name="description" content="Bilingual collection of dishes featuring cucumber — Thai and international recipes with sources.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🥒%3C/text%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --green-50:#f0fdf4;
      --green-100:#dcfce7;
      --green-200:#bbf7d0;
      --green-400:#4ade80;
      --green-500:#22c55e;
      --green-600:#16a34a;
      --green-700:#15803d;
      --green-800:#166534;
      --green-900:#14532d;
      --ink:#0b1f12;
      --muted:#5b7060;
      --paper:#fffefb;
      --shadow:0 10px 30px -10px rgba(20,83,45,.18);
      --shadow-lg:0 30px 60px -20px rgba(20,83,45,.25);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      font-family:'Prompt','Inter',system-ui,sans-serif;
      color:var(--ink);
      background:
        radial-gradient(60% 80% at 80% -10%, #d1fadf 0%, transparent 60%),
        radial-gradient(50% 60% at -10% 30%, #ecfccb 0%, transparent 60%),
        linear-gradient(180deg, var(--paper) 0%, #f6fbf3 100%);
      min-height:100vh;
      -webkit-font-smoothing:antialiased;
    }
    .container{max-width:1240px;margin:0 auto;padding:0 24px}

    /* ===== NAV ===== */
    nav{
      position:sticky;top:0;z-index:50;
      backdrop-filter:saturate(140%) blur(14px);
      -webkit-backdrop-filter:saturate(140%) blur(14px);
      background:rgba(255,254,251,.78);
      border-bottom:1px solid rgba(20,83,45,.08);
    }
    .nav-inner{display:flex;align-items:center;justify-content:space-between;height:68px}
    .brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:18px;color:var(--green-800);text-decoration:none}
    .brand .logo{
      width:38px;height:38px;border-radius:12px;
      background:linear-gradient(135deg,var(--green-400),var(--green-600));
      display:grid;place-items:center;color:#fff;box-shadow:var(--shadow);
      font-size:22px;
    }
    .lang-switch{display:flex;border:1px solid rgba(20,83,45,.15);border-radius:999px;overflow:hidden;background:#fff}
    .lang-switch button{
      border:0;background:transparent;padding:8px 16px;cursor:pointer;font:inherit;font-weight:600;color:var(--muted);
      transition:.2s;
    }
    .lang-switch button.active{background:var(--green-600);color:#fff}

    /* ===== HERO ===== */
    header.hero{padding:80px 0 56px;text-align:center;position:relative;overflow:hidden}
    header.hero::before{
      content:"";position:absolute;inset:auto auto -40% 50%;transform:translateX(-50%);
      width:1100px;height:1100px;border-radius:50%;
      background:radial-gradient(closest-side, rgba(34,197,94,.10), transparent 70%);
      pointer-events:none;
    }
    .eyebrow{
      display:inline-flex;align-items:center;gap:8px;
      padding:6px 14px;border-radius:999px;
      background:var(--green-100);color:var(--green-800);
      font-weight:600;font-size:13px;letter-spacing:.04em;text-transform:uppercase;
    }
    h1{
      font-family:'Playfair Display','Prompt',serif;
      font-weight:800;
      font-size:clamp(40px,6vw,72px);
      line-height:1.02;letter-spacing:-.02em;
      margin:18px 0 14px;
      color:var(--green-900);
    }
    h1 .accent{
      background:linear-gradient(90deg,var(--green-500),var(--green-700));
      -webkit-background-clip:text;background-clip:text;color:transparent;
    }
    .sub{color:var(--muted);font-size:18px;max-width:680px;margin:0 auto;line-height:1.6}
    .stats{display:flex;justify-content:center;gap:36px;margin-top:34px;flex-wrap:wrap}
    .stat{text-align:center}
    .stat .n{font-family:'Playfair Display',serif;font-weight:800;font-size:36px;color:var(--green-800)}
    .stat .l{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

    /* ===== TOOLBAR ===== */
    .toolbar{
      margin:48px 0 22px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;
      background:#fff;padding:14px;border-radius:18px;box-shadow:var(--shadow);
      border:1px solid rgba(20,83,45,.06);
    }
    .search{flex:1;display:flex;align-items:center;gap:10px;min-width:240px;padding:8px 14px;border-radius:12px;background:var(--green-50)}
    .search input{flex:1;border:0;background:transparent;font:inherit;outline:none;font-size:15px}
    .search svg{flex-shrink:0;color:var(--green-700)}
    select{
      font:inherit;font-size:14px;border:1px solid rgba(20,83,45,.15);border-radius:12px;
      padding:10px 14px;background:#fff;color:var(--ink);cursor:pointer;
    }
    .chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
    .chip{
      padding:6px 14px;border-radius:999px;background:#fff;
      border:1px solid rgba(20,83,45,.12);font-size:13px;font-weight:500;
      color:var(--muted);cursor:pointer;transition:.2s;
    }
    .chip:hover{border-color:var(--green-400);color:var(--green-700)}
    .chip.active{background:var(--green-600);color:#fff;border-color:var(--green-600)}

    /* ===== CARDS ===== */
    main{padding:0 0 80px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:22px}
    .card{
      background:#fff;border-radius:20px;overflow:hidden;
      box-shadow:var(--shadow);border:1px solid rgba(20,83,45,.06);
      display:flex;flex-direction:column;
      transition:transform .25s ease, box-shadow .25s ease;
    }
    .card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
    .card-head{
      height:140px;position:relative;overflow:hidden;
      background:linear-gradient(135deg,#bbf7d0 0%, #4ade80 50%, #16a34a 100%);
      display:grid;place-items:center;
    }
    .card-head::before{
      content:"";position:absolute;inset:-30% -10% auto auto;width:240px;height:240px;border-radius:50%;
      background:radial-gradient(closest-side, rgba(255,255,255,.4), transparent 70%);
    }
    .card-head .glyph{font-size:64px;filter:drop-shadow(0 6px 12px rgba(0,0,0,.15));position:relative;z-index:1}
    .flag{
      position:absolute;top:12px;left:12px;
      background:rgba(255,255,255,.9);backdrop-filter:blur(6px);
      padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;color:var(--green-800);
      display:flex;align-items:center;gap:6px;z-index:2;
    }
    .card-body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:10px;flex:1}
    .card-title{
      font-family:'Playfair Display','Prompt',serif;font-weight:700;
      font-size:20px;line-height:1.25;color:var(--green-900);margin:0;
    }
    .card-sub{font-size:13px;color:var(--muted);font-style:italic}
    .card-desc{color:#3a4a3e;font-size:14px;line-height:1.55}
    .card-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:12px}
    .tag{
      display:inline-flex;align-items:center;
      padding:3px 10px;border-radius:999px;background:var(--green-50);
      color:var(--green-800);font-size:12px;font-weight:500;
    }
    .card-actions{display:flex;justify-content:space-between;align-items:center;margin-top:14px;border-top:1px solid rgba(20,83,45,.06);padding-top:14px}
    .card-actions a{
      color:var(--green-700);text-decoration:none;font-weight:600;font-size:14px;
      display:inline-flex;align-items:center;gap:6px;
    }
    .card-actions a:hover{color:var(--green-900)}
    .id-pill{font-size:12px;color:var(--muted);font-weight:500}

    /* ===== EMPTY ===== */
    .empty{text-align:center;padding:80px 20px;color:var(--muted)}
    .empty h3{font-family:'Playfair Display',serif;color:var(--green-800)}

    /* ===== FOOTER ===== */
    footer{
      padding:48px 0 36px;text-align:center;color:var(--muted);
      border-top:1px solid rgba(20,83,45,.08);background:rgba(255,255,255,.5);
    }
    footer .heart{color:var(--green-600)}

    @media(max-width:640px){
      .nav-inner{height:60px}
      header.hero{padding:48px 0 36px}
      .stats{gap:24px}
      .stat .n{font-size:28px}
    }

    /* Modal */
    .modal-bg{position:fixed;inset:0;background:rgba(20,83,45,.5);backdrop-filter:blur(6px);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
    .modal-bg.open{display:flex}
    .modal{background:#fff;max-width:640px;width:100%;border-radius:24px;overflow:hidden;box-shadow:var(--shadow-lg);max-height:90vh;overflow-y:auto}
    .modal-head{padding:24px 28px;background:linear-gradient(135deg,var(--green-100),var(--green-50));display:flex;justify-content:space-between;align-items:start;gap:16px}
    .modal-head h2{margin:0;font-family:'Playfair Display',serif;font-size:26px;color:var(--green-900);line-height:1.2}
    .close-btn{background:rgba(255,255,255,.7);border:0;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px;flex-shrink:0;color:var(--green-800)}
    .modal-body{padding:24px 28px;display:flex;flex-direction:column;gap:18px}
    .modal-section h4{margin:0 0 6px;color:var(--green-700);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
    .modal-section p{margin:0;line-height:1.6;color:#2a3a2d}
    .modal-actions{padding:16px 28px 24px}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;background:var(--green-600);color:#fff;text-decoration:none;font-weight:600;transition:.2s}
    .btn:hover{background:var(--green-700);transform:translateY(-1px)}
  </style>
</head>
<body>
  <nav>
    <div class="container nav-inner">
      <a class="brand" href="#"><span class="logo">🥒</span> <span data-i18n="brand">Cucumber Menu</span></a>
      <div class="lang-switch">

        <button data-lang="en">EN</button>

  <header class="hero">

  <main class="container">

    </div>
  </main>

  <footer>
    <div class="container">
      <div><span class="heart">🥒</span> <span data-i18n="footer_made">สร้างด้วยใจสำหรับคนรักแตงร้าน</span></div>
      <div style="opacity:.7;margin-top:6px;font-size:13px">© 2026 Cucumber Menu • <span data-i18n="footer_data">ข้อมูลอัปเดตอัตโนมัติทุก 1 ชั่วโมง</span></div>
    </div>
  </footer>

  <!-- Modal -->
  <div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-head">
        <div>
          <h2 id="m-title"></h2>
          <div id="m-sub" style="font-style:italic;color:var(--muted);margin-top:4px"></div>
        </div>
        <button class="close-btn" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="modal-section"><h4 data-i18n="m_country">ประเทศ</h4><p id="m-country"></p></div>
        <div class="modal-section"><h4 data-i18n="m_ingredients">ส่วนประกอบ</h4><p id="m-ingr"></p></div>
        <div class="modal-section"><h4 data-i18n="m_method">วิธีทำ</h4><p id="m-method"></p></div>
      </div>
      <div class="modal-actions"><a id="m-src" class="btn" target="_blank" rel="noopener">🔗 <span data-i18n="m_source">ดูสูตรเต็มจากแหล่งที่มา</span></a></div>
    </div>
  </div>

function applyI18n(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.dataset.i18n;
    if(I18N[lang][k]) el.textContent = I18N[lang][k];
  });
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{
    const k = el.dataset.i18nHtml;
    if(I18N[lang][k]) el.innerHTML = I18N[lang][k];
  });
  document.getElementById('q').placeholder = I18N[lang].search_ph;
  document.querySelectorAll('.lang-switch button').forEach(b=>b.classList.toggle('active', b.dataset.lang===lang));
  // Refresh country dropdown labels
  buildCountryFilter();
  render();
}

function buildCountryFilter(){
  const sel = document.getElementById('country');
  const cur = sel.value;
  const countries = [...new Set(DATA.map(d => lang==='th' ? d.country_th : d.country_en))].sort();
  sel.innerHTML = `<option value="">${I18N[lang].all_countries}</option>` + countries.map(c=>`<option value="${c}">${c}</option>`).join('');
  sel.value = cur;
}

function makeCard(d, i){
  const title = lang==='th' ? d.name_th : d.name_en;
  const subtitle = lang==='th' ? d.name_en : d.name_th;
  const country = lang==='th' ? d.country_th : d.country_en;
  const desc = lang==='th' ? (d.ingredients_th||'').slice(0,140)+'…' : (d.desc_en || d.method_th || '');
  const glyph = ICONS[i % ICONS.length];
  return `
    <article class="card" data-id="${d.id}">
      <div class="card-head">
        <div class="flag">${d.flag} ${country}</div>
        <div class="glyph">${glyph}</div>
      </div>
      <div class="card-body">
        <h3 class="card-title">${title}</h3>
        <div class="card-sub">${subtitle}</div>
        <p class="card-desc">${desc}</p>
        <div class="card-actions">
          <a href="${d.url}" target="_blank" rel="noopener">${I18N[lang].view_recipe} →</a>
          <span class="id-pill">#${String(d.id).padStart(3,'0')}</span>
        </div>
      </div>
    </article>`;
}

let activeChip = '';
function buildChips(){
  const groups = [
    {key:'', label:{th:'ทั้งหมด', en:'All'}},
    {key:'thai', label:{th:'ไทย 🇹🇭', en:'Thai 🇹🇭'}},
    {key:'asian', label:{th:'เอเชีย 🥢', en:'Asian 🥢'}},
    {key:'med', label:{th:'เมดิเตอร์เรเนียน 🌊', en:'Mediterranean 🌊'}},
    {key:'eu', label:{th:'ยุโรป 🇪🇺', en:'European 🇪🇺'}},
    {key:'drink', label:{th:'เครื่องดื่ม/ค็อกเทล 🍹', en:'Drinks / Cocktails 🍹'}},
    {key:'pickle', label:{th:'ของดอง 🥒', en:'Pickles 🥒'}},
  ];
  document.getElementById('chips').innerHTML = groups.map(g=>
    `<button class="chip ${activeChip===g.key?'active':''}" data-key="${g.key}">${g.label[lang]}</button>`
  ).join('');
  document.querySelectorAll('.chip').forEach(c=>{
    c.onclick = ()=>{ activeChip = c.dataset.key; buildChips(); render(); };
  });
}

function matchGroup(d, key){
  if(!key) return true;
  const c = d.country_th + ' ' + d.country_en;
  const n = d.name_th + ' ' + d.name_en;
  if(key==='thai') return c.includes('ไทย') || c.includes('Thai');
  if(key==='asian') return /(ญี่ปุ่น|เกาหลี|จีน|อินเดีย|อินโดนีเซีย|มาเลเซีย|เวียดนาม|เอเชีย|Japan|Korea|China|India|Indonesia|Malaysia|Vietnam|Asian)/.test(c);
  if(key==='med') return /(เมดิเตอร์|กรีก|เลบานอน|ตุรกี|อิสราเอล|Mediterranean|Greece|Lebanon|Turkey|Israel)/.test(c);
  if(key==='eu') return /(โปแลนด์|ฮังการี|เยอรมัน|บัลแกเรีย|รัสเซีย|สเปน|อังกฤษ|Poland|Hungary|Germany|Bulgaria|Russia|Spain|United Kingdom)/.test(c);
  if(key==='drink') return /(ค็อกเทล|Cocktail|Lemonade|Smoothie|Juice|Water|Martini|Gin|Margarita|Pimm|น้ำ)/i.test(n);
  if(key==='pickle') return /(ดอง|Pickle|Acar|Kimchi|Sobagi)/i.test(n);
  return true;
}

function render(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const cf = document.getElementById('country').value;
  const filtered = DATA.filter(d=>{
    if(cf){
      const c = lang==='th' ? d.country_th : d.country_en;
      if(c !== cf) return false;
    }
    if(!matchGroup(d, activeChip)) return false;
    if(!q) return true;
    const hay = [d.name_th, d.name_en, d.country_th, d.country_en, d.ingredients_th, d.method_th].join(' ').toLowerCase();
    return hay.includes(q);
  });
  const grid = document.getElementById('grid');
  grid.innerHTML = filtered.map((d,i)=>makeCard(d,i)).join('');
  document.getElementById('empty').style.display = filtered.length ? 'none' : 'block';
  // hook card click
  grid.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click', e=>{
      if(e.target.closest('a')) return; // let link clicks pass
      openModal(+card.dataset.id);
    });
  });
}

function openModal(id){
  const d = DATA.find(x=>x.id===id); if(!d) return;
  document.getElementById('m-title').textContent = lang==='th' ? d.name_th : d.name_en;
  document.getElementById('m-sub').textContent = lang==='th' ? d.name_en : d.name_th;
  document.getElementById('m-country').textContent = `${d.flag} ` + (lang==='th' ? d.country_th : d.country_en);
  document.getElementById('m-ingr').textContent = d.ingredients_th;
  document.getElementById('m-method').textContent = d.method_th;
  document.getElementById('m-src').href = d.url;
  document.getElementById('modal').classList.add('open');
}
function closeModal(){ document.getElementById('modal').classList.remove('open'); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

// stats
document.getElementById('stat-total').textContent = DATA.length;
document.getElementById('stat-countries').textContent = new Set(DATA.map(d=>d.country_th)).size;
document.getElementById('stat-updated').textContent = "2026-05-26";

// bind language switch
document.querySelectorAll('.lang-switch button').forEach(b=>{
  b.onclick = ()=>{ lang = b.dataset.lang; applyI18n(); };
});
document.getElementById('q').addEventListener('input', render);
document.getElementById('country').addEventListener('change', render);

buildChips();
applyI18n();
</script>
</body>
</html>
